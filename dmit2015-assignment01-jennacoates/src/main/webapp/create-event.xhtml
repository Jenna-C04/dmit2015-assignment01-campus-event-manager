<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html">
<f:view>
    <h:head>
        <title>Create Campus Event</title>
    </h:head>
    <h:body>
        <h1>DMIT2015-1261 Assignment 1 by Jenna Coates</h1>
        <h:form>
            <p:messages showDetail="true"/>
            <br />
            <p:panel header="Event Regsitration">
                <p:outputLabel for="eventName" value="Event Name" />
                <p:inputText id="eventName"
                             value="#{eventFormBean.campusEvent.eventName}"
                             rendered="true"
                             requiredMessage="Enter a name at least five characters long!"/>
                <br />
                <br />
                <p:outputLabel for="organizerName" value="Organizer Name" />
                <p:inputText id="organizerName"
                             value="#{eventFormBean.campusEvent.organizerName}"
                             required="true"
                             requiredMessage="Please enter a name for the organizer!"/>
                <br />
                <br />

                <p:outputLabel for="eventDate" value="Event Date"/>
                <p:datePicker id="eventDate"
                              value="#{eventFormBean.campusEvent.eventDate}"
                              required="true"
                              requiredMessage="Please select a date to hold the event!" />
                <br />
                <br />
                <p:outputLabel for="capacity" value="Capacity" />
                <p:inputNumber id="capacity"
                               value="#{eventFormBean.campusEvent.capacity}"
                               required="true"
                               requiredMessage="Capacity must be greater than zero!"
                               minValue="1"/>
                <br />
                <br />

                <p:commandButton value="Submit"
                                 action="#{eventFormBean.submit()}"
                                 update="@form"
                                 process="@form"/>
                <br />
                <br />
                <p:commandButton value="View Events"
                                 action="#{eventView.submit()}"
                                 update="@form"
                                 process="@form"/>
                <br />
                <br />
                <h:outputText value="#{eventFormBean.eventSummary}"/>
            </p:panel>
            <br />
            <br />



        </h:form>
    </h:body>
</f:view>
</html>
