<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html">
<f:view>
    <h:head>
        <title>View Events</title>
    </h:head>
    <h:body>
        <h1>View Events</h1>
        <h2>DMIT2015-1261 Assignment 1 by Jenna Coates</h2>
        <br />
        <br />
        <h:outputText
                value="Succesful submission : #{eventFormBean.submssions}"/>
        <br />
        <br />
        <p:dataTable>
            <p:dataView id="dataTable" var="currentEvent" value="#{eventInfoSession.events}">
                <p:column headerText="Event Name">
                    <h:outputText value="#{currentEvent.eventName}"/>
                </p:column>
                <p:column headerText="Orgaizer Name">
                    <h:outputText value="#{currentEvent.organizerName}"/>
                </p:column>
                <p:column headerText="Event Date">
                    <h:outputText value="#{currentEvent.eventDate}"/>
                </p:column>
                <p:column headerText="Capacity">
                    <h:outputText value="#{currentEvent.capacity}"/>
                </p:column>
                <p:column headerText="Id">
                    <h:outputText value="#{currentEvent.eventId}"/>
                </p:column>
            </p:dataView>
        </p:dataTable>

    </h:body>
</f:view>
</html>
